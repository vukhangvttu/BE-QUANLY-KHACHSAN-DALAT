server:
  port: 8310
  servlet:
    context-path: /khachsan-service
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: khachsan-service
  web:
    locale: vi_VN
    locale-resolver: fixed

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/QL-KHACH-SAN-DALAT
    username: ${USER_DB:YqKZwsA/4cLvT22dQpMngxAfnGorgm+xYzbzW1qgPHw=}
    password: ${USER_PW:D0/HnzSe7XZII4zTojifuRoYlSQy/k4dXJVgwOHsDBrKc19wWPHjT0KXXMhNwP9d}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GoldenEraHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    org.goldenera: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.http.converter.json: DEBUG
    org.springframework.transaction: TRACE
    vttu.khachsanservice.config.HibernateInterceptorWithUser: INFO


  file:
    name: /var/log/app/app.log

